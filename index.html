<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Arena</title>
<style>
:root{--bg:#181a24;--fg:#f0f0f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#181a24;--fg:#f0f0f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181a24;--fg:#f0f0f5}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
canvas{max-width:100%;max-height:calc(100% - 40px);aspect-ratio:10/7;background:#181a24;border-radius:8px;outline:none}
small{opacity:.6;text-align:center;padding:0 12px}
.credit{opacity:.9;font-weight:bold;font-size:14px}
</style>
</head>
<body>
<canvas id="c" width="1000" height="700" tabindex="0"></canvas>
<small>4 players, one keyboard. Share it Wisely. Click the game first.</small>
<small class="credit">Made by Johara</small>
<script>
const W=1000,H=700,ROUND=60,PR=20,CR=11,MAXC=6,SPEED=280,DASH=780,DASH_T=.16,DASH_CD=1.4,FRIC=6;
const GOLD="#ffcd3c",SILVER="#d2d7e1",WHITE="#f0f0f5",GREY="#8c91a5";
const A=[30,90,W-30,H-30];
const DEFS=[
 {name:"Red",color:"#eb5555",keys:["KeyW","KeyS","KeyA","KeyD"],dash:"ShiftLeft",hint:"WASD + Left Shift"},
 {name:"Blue",color:"#5096f0",keys:["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"],dash:"ShiftRight",hint:"Arrows + Right Shift"},
 {name:"Green",color:"#5acd78",keys:["KeyT","KeyG","KeyF","KeyH"],dash:"KeyR",hint:"TFGH + R"},
 {name:"Yellow",color:"#f0d246",keys:["KeyI","KeyK","KeyJ","KeyL"],dash:"KeyU",hint:"IJKL + U"}];
const spawns=[[A[0]+80,A[1]+80],[A[2]-80,A[1]+80],[A[0]+80,A[3]-80],[A[2]-80,A[3]-80]];
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const pressed=new Set();
let state="menu",tick=0,coins=[],parts=[],timeLeft=ROUND,countdown=3,last=performance.now();
const rnd=(a,b)=>a+Math.random()*(b-a);

const players=DEFS.map((d,i)=>({...d,spawn:spawns[i],reset(){this.x=this.spawn[0];this.y=this.spawn[1];this.vx=this.vy=0;this.fx=1;this.fy=0;this.score=0;this.dashLeft=0;this.cd=0;this.ddx=this.ddy=0}}));
players.forEach(p=>p.reset());

addEventListener("keydown",e=>{
  if(e.code.startsWith("Arrow")||e.code==="Space")e.preventDefault();
  const first=!pressed.has(e.code);pressed.add(e.code);
  if(!first)return;
  if(state==="menu"&&(e.code==="Space"||e.code==="Enter"))start();
  else if(state==="over"&&e.code==="KeyR")start();
});
addEventListener("keyup",e=>pressed.delete(e.code));
addEventListener("blur",()=>pressed.clear());
cv.addEventListener("pointerdown",()=>cv.focus());

function start(){players.forEach(p=>p.reset());coins=[];parts=[];timeLeft=ROUND;countdown=3;state="countdown"}
function newCoin(){
  const gold=Math.random()<.18;let x,y;
  for(let i=0;i<50;i++){x=rnd(A[0]+40,A[2]-40);y=rnd(A[1]+40,A[3]-40);if(coins.every(o=>Math.hypot(x-o.x,y-o.y)>60))break}
  coins.push({x,y,gold,value:gold?3:1,phase:Math.random()*6.28});
}
function burst(x,y,color){for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,s=rnd(60,220),l=rnd(.3,.6);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,color})}}

function updatePlayer(p,dt){
  const [up,down,left,right]=p.keys;
  let dx=(pressed.has(right)?1:0)-(pressed.has(left)?1:0),dy=(pressed.has(down)?1:0)-(pressed.has(up)?1:0);
  const len=Math.hypot(dx,dy);
  if(len){dx/=len;dy/=len;p.fx=dx;p.fy=dy}
  if(pressed.has(p.dash)&&p.cd<=0){p.dashLeft=DASH_T;p.cd=DASH_CD;p.ddx=p.fx;p.ddy=p.fy}
  p.cd=Math.max(0,p.cd-dt);
  let mx,my;
  if(p.dashLeft>0){p.dashLeft-=dt;mx=p.ddx*DASH;my=p.ddy*DASH}else{mx=dx*SPEED;my=dy*SPEED}
  p.x+=(mx+p.vx)*dt;p.y+=(my+p.vy)*dt;
  const d=Math.max(0,1-FRIC*dt);p.vx*=d;p.vy*=d;
  p.x=Math.max(A[0]+PR,Math.min(A[2]-PR,p.x));p.y=Math.max(A[1]+PR,Math.min(A[3]-PR,p.y));
}
function collide(){
  const min=PR*2;
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
    const a=players[i],b=players[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);
    if(dist===0)b.x+=1;
    else if(dist<min){
      const nx=dx/dist,ny=dy/dist,push=(min-dist)/2;
      a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push;
      const fa=a.dashLeft>0?650:260,fb=b.dashLeft>0?650:260;
      b.vx+=nx*fa;b.vy+=ny*fa;a.vx-=nx*fb;a.vy-=ny*fb;
    }
  }
}
function collect(){
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    for(const p of players){
      if(Math.hypot(p.x-c.x,p.y-c.y)<PR+CR){p.score+=c.value;burst(c.x,c.y,c.gold?GOLD:p.color);coins.splice(i,1);break}
    }
  }
}
function update(dt){
  tick+=dt;
  if(state==="countdown"){countdown-=dt;if(countdown<=0)state="play";return}
  parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92});
  parts=parts.filter(p=>p.life>0);
  if(state!=="play")return;
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;state="over";return}
  players.forEach(p=>updatePlayer(p,dt));
  collide();collect();
  while(coins.length<MAXC)newCoin();
}

function text(x,y,s,size=24,color=WHITE,align="center",bold=true){
  ctx.font=`${bold?"bold ":""}${size}px Arial,Helvetica,sans-serif`;
  ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillText(s,x,y);
}
function circle(x,y,r,fill,stroke,lw){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
}
function drawPlayer(p){
  const {x,y}=p,r=PR;
  if(p.dashLeft>0)circle(x,y,r+10,null,p.color,3);
  ctx.fillStyle="#14161e";ctx.beginPath();ctx.ellipse(x,y+r,r,6,0,0,Math.PI*2);ctx.fill();
  circle(x,y,r,p.color,WHITE,3);
  circle(x+p.fx*r*.5,y+p.fy*r*.5,5,"#14141e");
  if(p.cd>0){
    const f=1-p.cd/DASH_CD;
    ctx.beginPath();ctx.arc(x,y,r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*f);
    ctx.strokeStyle=GREY;ctx.lineWidth=3;ctx.stroke();
  }
}
function drawCoin(c){
  const bob=Math.sin(tick*4+c.phase)*3,sq=Math.abs(Math.cos(tick*3+c.phase));
  const hw=Math.max(2,CR*(.35+.65*sq));
  ctx.beginPath();ctx.ellipse(c.x,c.y+bob,hw,CR,0,0,Math.PI*2);
  ctx.fillStyle=c.gold?GOLD:SILVER;ctx.fill();ctx.strokeStyle=WHITE;ctx.lineWidth=2;ctx.stroke();
}
function score(p,x,y){circle(x+10,y+10,10,p.color);text(x+30,y+10,String(p.score),22,WHITE,"left")}
function hud(){
  const s=Math.ceil(timeLeft);
  text(W/2,42,String(s),48,s>10?WHITE:"#ff6e6e");
  score(players[0],50,30);score(players[1],200,30);score(players[2],W-330,30);score(players[3],W-180,30);
}
function menu(){
  text(W/2,110,"COIN ARENA",60,GOLD);
  text(W/2,190,"4 players, one keyboard. Grab the most coins in 60 seconds!",18);
  text(W/2,225,"Gold coins = 3 points.  Bump rivals away.  Dash to steal coins.",13,GREY,"center",false);
  players.forEach((p,i)=>{
    const y=300+i*70;
    circle(330,y,20,p.color,WHITE,3);
    text(380,y-12,`Player ${i+1} (${p.name})`,18,WHITE,"left");
    text(380,y+12,p.hint,13,GREY,"left",false);
  });
  if(Math.floor(tick*2)%2===0)text(W/2,H-60,"Press SPACE or ENTER to start",28);
}
function over(){
  ctx.fillStyle="#0e0f18";ctx.fillRect(200,90,W-400,H-180);
  ctx.strokeStyle=GREY;ctx.lineWidth=3;ctx.strokeRect(200,90,W-400,H-180);
  const best=Math.max(...players.map(p=>p.score)),win=players.filter(p=>p.score===best);
  let title,color,size;
  if(win.length===1){title=`${win[0].name} wins!`;color=win[0].color;size=48}
  else{title="Tie: "+win.map(w=>w.name).join(", ");color=GOLD;size=30}
  text(W/2,150,"TIME'S UP!",28);text(W/2,230,title,size,color);
  [...players].sort((a,b)=>b.score-a.score).forEach((p,r)=>{
    const y=330+r*55;
    circle(W/2-130,y,16,p.color);
    text(W/2-100,y,`${r+1}. ${p.name}`,20,WHITE,"left");
    text(W/2+110,y,String(p.score),20,GOLD,"left");
  });
  text(W/2,H-130,"Press R to play again",18,GREY);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#181a24";ctx.fillRect(0,0,W,H);
  if(state==="menu"){menu();return}
  ctx.fillStyle="#222636";ctx.fillRect(A[0],A[1],A[2]-A[0],A[3]-A[1]);
  ctx.strokeStyle=GREY;ctx.lineWidth=3;ctx.strokeRect(A[0],A[1],A[2]-A[0],A[3]-A[1]);
  coins.forEach(drawCoin);players.forEach(drawPlayer);
  parts.forEach(p=>circle(p.x,p.y,Math.max(1,5*p.life/p.max),p.color));
  hud();
  if(state==="countdown")text(W/2,H/2+30,String(Math.max(1,Math.ceil(countdown))),72);
  else if(state==="over")over();
}
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
cv.focus();
</script>
</body>
</html>
